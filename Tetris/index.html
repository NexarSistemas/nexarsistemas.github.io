<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tetris Deluxe | Nexar Sistemas</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #050510; color: #c0c0ff; font-family: system-ui, sans-serif; }
    body { display: grid; place-items: center; }
    .status { padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div class="status" id="status">Cargando Tetris…</div>
  <script>
    fetch('https://raw.githubusercontent.com/NexarSistemas/Tetris/main/index.html', { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.text();
      })
      .then((html) => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch((error) => {
        console.error('No se pudo cargar Tetris', error);
        document.getElementById('status').innerHTML = 'No se pudo cargar Tetris. <a href="https://github.com/NexarSistemas/Tetris">Ver repositorio</a>';
      });
  </script>
</body>
</html>
